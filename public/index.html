<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxymeter Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🫀Oxymeter</h1>
  
  <div id="auth">
    <!-- Registrácia -->
    <div id="registerSection">
      <h2>Registrácia</h2>
      
      <div class="input-group">
        <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
        <span class="error-message" id="regEmailError"></span>
      </div>
      <div class="input-group">
        <div class="password-wrapper">
          <input type="password" id="regPass" placeholder="Heslo (min. 8 znakov)" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="regPass" aria-label="Zobraziť heslo">
            <span class="eye-icon">👁</span>
          </button>
        </div>
        <span class="error-message" id="regPassError"></span>
        <div class="password-strength" id="regPassStrength"></div>
      </div>
      <div class="input-group">
        <div class="password-wrapper">
          <input type="password" id="regPassConfirm" placeholder="Zopakujte heslo" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="regPassConfirm" aria-label="Zobraziť heslo">
            <span class="eye-icon">👁</span>
          </button>
        </div>
        <span class="error-message" id="regPassConfirmError"></span>
      </div>
      <button id="registerBtn" class="primary-btn">
        <span class="btn-text">Registrovať</span>
        <span class="btn-spinner" style="display:none;"></span>
      </button>
      <p class="switch-auth">
        Už máte účet? <a href="#" id="showLogin">Prihláste sa</a>
      </p>
    </div>
   
    <!-- Prihlásenie -->
    <div id="loginSection" style="display:none;">
      <h2>Prihlásenie</h2>
      
      <div class="input-group">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <span class="error-message" id="loginEmailError"></span>
      </div>
      <div class="input-group">
        <div class="password-wrapper">
          <input type="password" id="loginPass" placeholder="Heslo" autocomplete="current-password">
          <button type="button" class="toggle-password" data-target="loginPass" aria-label="Zobraziť heslo">
            <span class="eye-icon">👁</span>
          </button>
        </div>
        <span class="error-message" id="loginPassError"></span>
      </div>
      <button id="loginBtn" class="primary-btn">
        <span class="btn-text">Prihlásiť</span>
        <span class="btn-spinner" style="display:none;"></span>
      </button>
      <button id="resetBtn" class="secondary-btn">Zabudol som heslo</button>
      <p class="switch-auth">
        Nemáte účet? <a href="#" id="showRegister">Registrujte sa</a>
      </p>
    </div>
  </div>
  
  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <div class="dashboard-header">
      <p>Prihlásený ako: <b id="userEmail"></b></p>
      <button id="logoutBtn" class="secondary-btn">Odhlásiť sa</button>
    </div>

    <!-- Pridať ESP zariadenie -->
    <div id="deviceSection" class="device-section">
      <h2>Pridať ESP zariadenie</h2>
      <p class="section-desc">Zadajte Device UID vášho ESP zariadenia (nájdete ho v Sériovom monitore pri štarte ESP).</p>
      <div class="input-group">
        <input type="text" id="deviceUid" placeholder="Device UID (napr. OX-001)">
        <span class="error-message" id="deviceUidError"></span>
      </div>
      <button id="assignDeviceBtn" class="primary-btn">
        <span class="btn-text">Pridať zariadenie</span>
        <span class="btn-spinner" style="display:none;"></span>
      </button>
      <p id="deviceMsg" class="device-msg"></p>
    </div>

    <!-- Merania -->
    <div class="measurements-section">
      <h2>Moje merania</h2>
      <button id="loadDataBtn" class="primary-btn">Načítať merania</button>
      <div id="output"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
