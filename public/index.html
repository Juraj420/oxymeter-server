<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxymeter Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🫀 Oxymeter</h1>
  
  <div id="auth">
    <!-- Registrácia -->
    <div id="registerSection">
      <h2>Registrácia</h2>
      
      <div class="input-group">
        <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
        <span class="error-message" id="regEmailError"></span>
      </div>

      <div class="input-group">
        <div class="password-wrapper">
          <input type="password" id="regPass" placeholder="Heslo (min. 8 znakov)" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="regPass">
            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="error-message" id="regPassError"></span>
        <div class="password-strength" id="regPassStrength"></div>
      </div>

      <div class="input-group">
        <div class="password-wrapper">
          <input type="password" id="regPassConfirm" placeholder="Zopakujte heslo" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="regPassConfirm">
            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="error-message" id="regPassConfirmError"></span>
      </div>

      <button id="registerBtn" class="primary-btn">
        <span class="btn-text">Registrovať</span>
        <span class="btn-spinner" style="display:none;">⏳</span>
      </button>

      <p class="switch-auth">
        Už máte účet? <a href="#" id="showLogin">Prihláste sa</a>
      </p>
    </div>

    <!-- Prihlásenie -->
    <div id="loginSection" style="display:none;">
      <h2>Prihlásenie</h2>
      
      <div class="input-group">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <span class="error-message" id="loginEmailError"></span>
      </div>

      <div class="input-group">
        <div class="password-wrapper">
          <input type="password" id="loginPass" placeholder="Heslo" autocomplete="current-password">
          <button type="button" class="toggle-password" data-target="loginPass">
            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="error-message" id="loginPassError"></span>
      </div>

      <button id="loginBtn" class="primary-btn">
        <span class="btn-text">Prihlásiť</span>
        <span class="btn-spinner" style="display:none;">⏳</span>
      </button>

      <button id="resetBtn" class="secondary-btn">Zabudol som heslo</button>

      <p class="switch-auth">
        Nemáte účet? <a href="#" id="showRegister">Registrujte sa</a>
      </p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <div class="dashboard-header">
      <p>Prihlásený ako: <b id="userEmail"></b></p>
      <button id="logoutBtn" class="secondary-btn">Odhlásiť sa</button>
    </div>
    <button id="loadDataBtn" class="primary-btn">Načítať merania</button>
    <div id="output"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
