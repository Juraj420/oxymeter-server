<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset hesla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Obnova hesla</h2>
    <p style="text-align: center; color: #666; margin-bottom: 25px; font-size: 14px;">Zadajte nové heslo pre váš účet</p>
    
    <div class="input-group">
      <label for="newPass" style="display: block; margin-bottom: 5px; color: #333; font-size: 14px; font-weight: 600;">Nové heslo</label>
      <div class="password-wrapper">
        <input type="password" id="newPass" placeholder="Minimálne 8 znakov" autocomplete="new-password">
        <button type="button" class="toggle-password" data-target="newPass" aria-label="Zobraziť heslo">
          <span class="eye-icon">👁</span>
        </button>
      </div>
      <span class="error-message" id="passwordError"></span>
    </div>

    <button onclick="resetPassword()" id="submitBtn">Zmeniť heslo</button>
    
    <div class="switch-auth">
      <a href="/">← Späť na prihlásenie</a>
    </div>
  </div>

  <script>
    // Zobrazenie/skrytie hesla (rovnaké ako v app.js)
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.onclick = () => {
        const targetId = button.getAttribute("data-target");
        const input = document.getElementById(targetId);
        const icon = button.querySelector(".eye-icon");
        
        if (input.type === "password") {
          input.type = "text";
          icon.style.textDecoration = "line-through";
          button.classList.add("active");
        } else {
          input.type = "password";
          icon.style.textDecoration = "none";
          button.classList.remove("active");
        }
      };
    });

    function showError(message) {
      const errorSpan = document.getElementById("passwordError");
      const input = document.getElementById("newPass");
      
      errorSpan.textContent = message;
      errorSpan.style.display = "block";
      input.classList.add("error");
      
      setTimeout(() => {
        errorSpan.style.display = "none";
        input.classList.remove("error");
      }, 3000);
    }

    async function resetPassword() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      const newPassword = document.getElementById("newPass").value;
      const submitBtn = document.getElementById("submitBtn");
      const input = document.getElementById("newPass");
      
      input.classList.remove("error");
      document.getElementById("passwordError").style.display = "none";
      
      if (!newPassword) {
        showError("Zadajte nové heslo");
        return;
      }

      if (newPassword.length < 8) {
        showError("Heslo musí obsahovať aspoň 8 znakov");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Prebieha zmena...";

      try {
        const res = await fetch("/api/set-new-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword })
        });
        
        const data = await res.json();
        
        if (data.success) {
          alert(data.message);
          window.location.href = "/";
        } else {
          showError(data.message || "Nastala chyba pri zmene hesla");
          submitBtn.disabled = false;
          submitBtn.textContent = "Zmeniť heslo";
        }
      } catch (error) {
        showError("Nastala chyba. Skúste to prosím znova.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Zmeniť heslo";
      }
    }

    document.getElementById("newPass").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        resetPassword();
      }
    });
  </script>
</body>
</html>
