<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset hesla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Obnova hesla</h2>
    <p style="text-align: center; color: #666; margin-bottom: 25px; font-size: 14px;">Zadajte nové heslo pre váš účet</p>
    
    <div class="input-group">
      <label for="newPass" style="display: block; margin-bottom: 5px; color: #333; font-size: 14px; font-weight: 600;">Nové heslo</label>
      <div class="password-wrapper">
        <input type="password" id="newPass" placeholder="Minimálne 8 znakov" autocomplete="new-password">
        <button type="button" class="toggle-password" data-target="newPass" aria-label="Zobraziť heslo">
          <span class="eye-icon">👁</span>
        </button>
      </div>
      <span class="error-message" id="passwordError"></span>
    </div>
    
    <button type="button" onclick="resetPassword()" id="submitBtn">Zmeniť heslo</button>
    
    <div class="switch-auth">
      <a href="/">← Späť na prihlásenie</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
