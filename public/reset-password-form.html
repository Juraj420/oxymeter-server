
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Obnova hesla - Oxymeter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Obnova hesla</h1>
  <p>Zadaj nové heslo pre svoj účet</p>

  <input type="password" id="newPassword" placeholder="Nové heslo">
  <input type="password" id="confirmPassword" placeholder="Potvrď heslo">
  <button id="setNewPasswordBtn">Nastaviť heslo</button>

  <div id="msg" style="margin-top: 10px;"></div>
</div>

<script>
  // Získame token z URL
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  const btn = document.getElementById('setNewPasswordBtn');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', async () => {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!newPassword || !confirmPassword) {
      msg.innerText = "Vyplň všetky polia";
      msg.style.color = "red";
      return;
    }
    if (newPassword !== confirmPassword) {
      msg.innerText = "Heslá sa nezhodujú";
      msg.style.color = "red";
      return;
    }

    try {
      const res = await fetch('https://oxymeter-server.onrender.com/api/set-new-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, newPassword })
      });

      const text = await res.text();
      msg.innerText = text;
      msg.style.color = res.ok ? "green" : "red";

      if (res.ok) {
        setTimeout(() => {
          window.location.href = "index.html";
        }, 2000); // po 2 sekundách presmeruje späť na login
      }

    } catch (err) {
      console.error(err);
      msg.innerText = "Chyba pri nastavovaní hesla";
      msg.style.color = "red";
    }
  });
</script>
</body>
</html>
