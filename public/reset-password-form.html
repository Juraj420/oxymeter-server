<!DOCTYPE html>                      <!-- Deklarácia typu dokumentu - HTML5 -->
<html lang="sk">                     <!-- Otváracie HTML tag, jazyk nastavený na slovenčinu -->
<head>                               <!-- Začiatok hlavičky dokumentu (metadáta, štýly, skripty) -->
  <meta charset="UTF-8">             <!-- Nastavenie kódovania znakov na UTF-8 (podpora slovenských znakov) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- Nastavenie viewportu pre responzívny dizajn na mobiloch -->
  <title>Reset hesla</title>         <!-- Názov stránky zobrazený v záložke prehliadača -->
  <link rel="stylesheet" href="style.css">  <!-- Pripojenie externého CSS súboru pre štýlovanie -->
</head>                              <!-- Koniec hlavičky -->
<body>                               <!-- Začiatok tela dokumentu (viditeľný obsah stránky) -->
  <div class="container">            <!-- Hlavný kontajner pre obsah stránky -->
    <h2>Obnova hesla</h2>            <!-- Nadpis stránky -->
    <p style="text-align: center; color: #666; margin-bottom: 25px; font-size: 14px;">Zadajte nové heslo pre váš účet</p>  <!-- Popisný text - vycentrovaný, sivý, s rozstupom 25px, veľkosť 14px -->
    
    <div class="input-group">        <!-- Skupina pre input nového hesla a chybovú hlášku -->
      <label for="newPass" style="display: block; margin-bottom: 5px; color: #333; font-weight: 600;">Nové heslo</label>  <!-- Popisok pre input pole, blokový element, spodný rozstup 5px, tmavosivá farba, tučné písmo -->
      <div class="password-wrapper">  <!-- Wrapper pre heslo a tlačidlo na zobrazenie/skrytie -->
        <input type="password" id="newPass" placeholder="Minimálne 8 znakov" autocomplete="new-password">  <!-- Input pre nové heslo, typ password (skryté), placeholder text, automatické dopĺňanie -->
        <button type="button" class="toggle-password" data-target="newPass" aria-label="Zobraziť heslo">  <!-- Tlačidlo na prepnutie viditeľnosti hesla, typ button (neodošle formulár), data-target určuje ktorý input ovláda -->
           <span class="eye-icon">👁</span>  <!-- Ikona oka -->
        </button>                    <!-- Koniec tlačidla -->
      </div>                         <!-- Koniec password-wrapper -->
      <span class="error-message" id="passwordError"></span>  <!-- Element pre zobrazenie chybových hlášok (napr. "Heslo je príliš krátke") -->
    </div>                           <!-- Koniec input-group -->
    
    <button type="button" id="submitBtn">Zmeniť heslo</button>  <!-- Tlačidlo pre odoslanie nového hesla, typ button (neodošle formulár automaticky) -->
    
    <div class="switch-auth">        <!-- Kontajner pre navigačný odkaz -->
      <a href="/">← Späť na prihlásenie</a>  <!-- Odkaz späť na hlavnú prihlasovaciu stránku -->
    </div>                           <!-- Koniec switch-auth -->
  </div>                             <!-- Koniec hlavného kontajnera -->
  
  <script src="app.js"></script>     <!-- Pripojenie externého JavaScript súboru s logikou pre reset hesla -->

</body>                              <!-- Koniec tela dokumentu -->
</html>                              <!-- Koniec HTML dokumentu -->
