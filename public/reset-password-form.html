<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Zabudnuté heslo - Oxymeter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Zabudnuté heslo</h1>
  <p>Zadaj svoj email a pošleme ti odkaz na reset hesla</p>

  <input type="email" id="email" placeholder="Tvoj email">
  <button id="sendResetBtn">Odoslať</button>

  <div id="msg" style="margin-top: 10px;"></div>
</div>

<script>
  const btn = document.getElementById('sendResetBtn');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) {
      msg.innerText = "Zadaj email";
      msg.style.color = "red";
      return;
    }

    try {
      const res = await fetch('https://oxymeter-server.onrender.com/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();
      if (data.success) {
        msg.innerText = "Email s odkazom bol odoslaný";
        msg.style.color = "green";
      } else {
        msg.innerText = data.message || "Chyba pri odosielaní emailu";
        msg.style.color = "red";
      }
    } catch (err) {
      console.error(err);
      msg.innerText = "Chyba pri odosielaní";
      msg.style.color = "red";
    }
  });
</script>
</body>
</html>
